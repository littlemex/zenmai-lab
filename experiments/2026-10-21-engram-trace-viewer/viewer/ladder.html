<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engram ladder</title>
  <link rel="stylesheet" href="css/ladder.css">
</head>
<body>
  <header class="top">
    <h1 data-i18n="title"></h1>
    <span id="title" class="muted"></span>
    <span class="spacer"></span>
    <label class="picker"><span data-i18n="compareWith"></span> <select id="b"></select></label>
    <button id="lang" class="pill" type="button"></button>
    <a id="table-link" href="index.html" data-i18n="tableView"></a>
  </header>
  <p id="error" class="error" hidden></p>
  <main>
    <section class="overview">
      <p id="headline" class="headline"></p>
      <p class="intro" data-i18n="intro"></p>
      <div id="text" class="text"></div>
      <p class="legend" data-i18n-html="textLegend"></p>
      <h2 data-i18n="chartTitle"></h2>
      <p class="small muted" data-i18n="chartNote"></p>
      <div id="chart-legend" class="chart-legend"></div>
      <div class="chart-wrap"><div id="chart-axis"></div><div id="chart" class="chart-scroll"></div></div>
      <details class="more">
        <summary data-i18n="moreTitle"></summary>
        <p data-i18n="more1"></p>
        <p data-i18n="more2"></p>
        <p id="counts" class="small"></p>
      </details>
    </section>
    <section class="story" aria-live="polite">
      <div class="story-nav">
        <button id="prev" class="pill" type="button" data-i18n-aria="prevPos">&larr;</button>
        <span id="where" class="muted"></span>
        <button id="next" class="pill" type="button" data-i18n-aria="nextPos">&rarr;</button>
      </div>
      <div id="question" class="card"></div>
      <div id="lookup" class="card"></div>
      <div class="card">
        <h3 data-i18n="step3"></h3>
        <p class="small" data-i18n="step3Note"></p>
        <div class="block-nav">
          <button id="play" class="pill primary" type="button"></button>
          <input id="block" type="range" min="0" max="11" value="0" data-i18n-aria="block">
          <span id="block-label" class="block-label"></span>
        </div>
        <div id="dists" class="dists"></div>
        <h4 data-i18n="curveTitle"></h4>
        <div id="curve"></div>
      </div>
      <div id="answer" class="card"></div>
    </section>
  </main>
  <script type="module" src="js/ladder.js"></script>
</body>
</html>
